name: Deploy

on:
  push:
    branches: [main]
  # Allows manual re-deploys from the Actions tab without a code change,
  # e.g. after updating an EB environment variable via CloudFormation.
  workflow_dispatch:
    inputs:
      skip_release:
        description: 'Skip maven release:prepare/perform and deploy current POM version as-is'
        type: boolean
        default: false

permissions:
  # maven-release-plugin pushes 2 commits and a tag back to main.
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  # Never cancel a deploy in progress — a mid-deploy cancel leaves EB
  # stuck in "Updating" and S3 partially synced.
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine which modules changed
        id: filter
        shell: bash
        run: |
          # A manual dispatch is an explicit request to deploy regardless of
          # what changed — e.g. redeploying after an infra-only change that
          # needs the app restarted to pick up a new CloudFormation-driven
          # env var. There's no meaningful "diff" for this event type, so
          # skip path detection entirely and just deploy everything.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — deploying all modules regardless of changed paths."
            echo "api=true" >> $GITHUB_OUTPUT
            echo "worker=true" >> $GITHUB_OUTPUT
            echo "web=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # No prior commit to diff against (first push to the branch,
            # or a force-push GitHub can't compute a range for) — deploy
            # everything rather than guess.
            echo "No previous commit to diff against — deploying all modules."
            echo "api=true" >> $GITHUB_OUTPUT
            echo "worker=true" >> $GITHUB_OUTPUT
            echo "web=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "Changed files:"
          echo "$CHANGED"
          echo "api=$(echo "$CHANGED" | grep -q '^api/' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "worker=$(echo "$CHANGED" | grep -q '^worker/' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "web=$(echo "$CHANGED" | grep -q '^web/' && echo true || echo false)" >> $GITHUB_OUTPUT

  deploy-api:
    name: Release & deploy API to Elastic Beanstalk
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # release:prepare inspects full git history; shallow clone breaks it.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: api/pom.xml

      - name: Configure Git identity for release commits
        # release:prepare commits twice. Without a git identity the commit fails.
        if: inputs.skip_release != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Maven release:prepare + release:perform
        if: inputs.skip_release != true
        working-directory: api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mvnw --no-transfer-progress --batch-mode \
            release:prepare release:perform \
            -DlocalCheckout=true \
            -Dusername=${{ github.actor }} \
            -Dpassword=${{ secrets.GITHUB_TOKEN }}

      - name: Build JAR (release skipped)
        if: inputs.skip_release == true
        working-directory: api
        run: ./mvnw --no-transfer-progress --batch-mode package -DskipTests

      - name: Extract version
        # When releasing: read the tag written by release:prepare from git.
        # When skipping: read the POM version directly and strip -SNAPSHOT.
        id: version
        working-directory: api
        shell: bash
        run: |
          if [ "${{ inputs.skip_release }}" = "true" ]; then
            # -DforceStdout writes to stdout alongside Maven's own log, and
            # the two can land on the same line with no separator (seen in
            # practice: "[INFO] [stdout] 0.0.24-SNAPSHOT"), which broke the
            # previous "tail -n 1" mitigation. -Doutput writes the raw value
            # straight to a file instead, bypassing stdout entirely.
            ./mvnw help:evaluate -Dexpression=project.version -q -Doutput=/tmp/version.txt
            VERSION=$(cat /tmp/version.txt)
          else
            VERSION=$(git describe --tags --abbrev=0 | sed 's/compendium-api-//')
          fi
          echo "release_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Locate JAR
        id: jar
        working-directory: api
        shell: bash
        run: |
          JAR=$(find "$(pwd)/target" -name "compendium-api-*.jar" ! -name "*sources*" ! -path "*/staging/*" | head -1)
          echo "jar_path=$JAR" >> $GITHUB_OUTPUT

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload JAR to S3 artifact bucket
        run: |
          aws s3 cp "${{ steps.jar.outputs.jar_path }}" \
            "s3://${{ secrets.EB_ARTIFACT_BUCKET }}/compendium-api-${{ steps.version.outputs.release_version }}.jar"

      - name: Create EB application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name ${{ secrets.EB_APPLICATION_NAME }} \
            --version-label "${{ steps.version.outputs.release_version }}" \
            --source-bundle \
              S3Bucket="${{ secrets.EB_ARTIFACT_BUCKET }}",S3Key="compendium-api-${{ steps.version.outputs.release_version }}.jar" \
            --auto-create-application \
            --process

      - name: Wait for application version to process
        # --process makes EB validate the S3 bundle up front (readable,
        # well-formed) instead of deferring that to the deploy step, where
        # a failure shows up as an opaque environment-health error instead
        # of a StatusReason we can print here.
        run: |
          for i in $(seq 1 20); do
            STATUS=$(aws elasticbeanstalk describe-application-versions \
              --application-name ${{ secrets.EB_APPLICATION_NAME }} \
              --version-labels "${{ steps.version.outputs.release_version }}" \
              --query "ApplicationVersions[0].Status" --output text)
            echo "Application version status: $STATUS (attempt $i/20)"
            if [ "$STATUS" = "PROCESSED" ]; then
              exit 0
            fi
            if [ "$STATUS" = "FAILED" ]; then
              REASON=$(aws elasticbeanstalk describe-application-versions \
                --application-name ${{ secrets.EB_APPLICATION_NAME }} \
                --version-labels "${{ steps.version.outputs.release_version }}" \
                --query "ApplicationVersions[0].StatusReason" --output text)
              echo "Application version processing failed: $REASON" >&2
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for application version to process." && exit 1

      - name: Resolve current EB environment name
        # The CloudFormation-managed environment gets recreated under a new
        # name whenever an immutable option setting changes (see the comment
        # on EBEnvironment in infra/api-stack.yml), so the name can't be
        # pinned in a secret. Look up whichever environment is currently
        # live instead — this app has exactly one non-terminated environment
        # at a time.
        id: eb_env
        run: |
          ENV_NAME=$(aws elasticbeanstalk describe-environments \
            --application-name ${{ secrets.EB_APPLICATION_NAME }} \
            --query "Environments[?Status!='Terminated'] | [0].EnvironmentName" \
            --output text)
          if [ -z "$ENV_NAME" ] || [ "$ENV_NAME" = "None" ]; then
            echo "No active EB environment found for application ${{ secrets.EB_APPLICATION_NAME }}" >&2
            exit 1
          fi
          echo "Resolved environment: $ENV_NAME"
          echo "environment_name=$ENV_NAME" >> $GITHUB_OUTPUT

      - name: Deploy to EB environment
        run: |
          aws elasticbeanstalk update-environment \
            --application-name ${{ secrets.EB_APPLICATION_NAME }} \
            --environment-name ${{ steps.eb_env.outputs.environment_name }} \
            --version-label "${{ steps.version.outputs.release_version }}"

      - name: Wait for EB environment to become Ready
        # Poll every 15 s for up to 10 min. EB returns "Updating" while
        # deploying and "Ready" when it's done processing the request —
        # but "Ready" alone doesn't mean the new version actually rolled
        # out: EB can silently no-op an update (e.g. an S3 permission
        # error on the source bundle) and settle back on "Ready" with the
        # old VersionLabel still in place. Check VersionLabel and Health
        # too so that case fails the job instead of reporting green.
        run: |
          EXPECTED_VERSION="${{ steps.version.outputs.release_version }}"
          for i in $(seq 1 40); do
            read -r STATUS HEALTH VERSION_LABEL <<< $(aws elasticbeanstalk describe-environments \
              --application-name ${{ secrets.EB_APPLICATION_NAME }} \
              --environment-names ${{ steps.eb_env.outputs.environment_name }} \
              --query "Environments[0].[Status,Health,VersionLabel]" --output text)
            echo "EB status: $STATUS, health: $HEALTH, version: $VERSION_LABEL (attempt $i/40)"
            if [ "$STATUS" = "Ready" ]; then
              if [ "$VERSION_LABEL" != "$EXPECTED_VERSION" ]; then
                echo "EB settled on Ready but VersionLabel is '$VERSION_LABEL', expected '$EXPECTED_VERSION'. The deploy did not actually roll out — check the EB environment's Events tab in the console." >&2
                exit 1
              fi
              if [ "$HEALTH" = "Red" ]; then
                echo "EB deployed $EXPECTED_VERSION but environment health is Red." >&2
                exit 1
              fi
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for EB to become Ready." && exit 1

  deploy-worker:
    name: Release & deploy worker Lambda
    # Sequenced after deploy-api, not parallel to it — both run
    # maven-release-plugin, which pushes 2 commits + a tag back to main.
    # Racing pushes from two jobs in the same run means whichever finishes
    # second gets a non-fast-forward rejection. needs: deploy-api forces
    # this job to wait its turn instead.
    #
    # Setting our own `if:` below replaces the implicit default of
    # success(), so deploy-api's outcome has to be checked explicitly here
    # too, not assumed: a skipped deploy-api (its own path didn't change —
    # see detect-changes) must still let this job run, but an actually
    # *failed* deploy-api must not — proceeding past a broken API deploy to
    # push another release commit would only compound the mess.
    needs: [detect-changes, deploy-api]
    if: |
      needs.detect-changes.outputs.worker == 'true' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # release:prepare inspects full git history; shallow clone breaks it.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: worker/pom.xml

      - name: Configure Git identity for release commits
        if: inputs.skip_release != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Maven release:prepare + release:perform
        if: inputs.skip_release != true
        working-directory: worker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mvnw --no-transfer-progress --batch-mode \
            release:prepare release:perform \
            -DlocalCheckout=true \
            -Dusername=${{ github.actor }} \
            -Dpassword=${{ secrets.GITHUB_TOKEN }}

      - name: Build JAR (release skipped)
        if: inputs.skip_release == true
        working-directory: worker
        run: ./mvnw --no-transfer-progress --batch-mode package -DskipTests

      - name: Extract version
        id: version
        working-directory: worker
        shell: bash
        run: |
          if [ "${{ inputs.skip_release }}" = "true" ]; then
            # See deploy-api's identical step for why -Doutput replaces
            # -DforceStdout here.
            ./mvnw help:evaluate -Dexpression=project.version -q -Doutput=/tmp/version.txt
            VERSION=$(cat /tmp/version.txt)
          else
            VERSION=$(git describe --tags --abbrev=0 | sed 's/compendium-worker-//')
          fi
          echo "release_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Locate JAR
        id: jar
        working-directory: worker
        shell: bash
        run: |
          JAR=$(find "$(pwd)/target" -name "compendium-worker-*.jar" ! -name "*sources*" ! -path "*/staging/*" | head -1)
          echo "jar_path=$JAR" >> $GITHUB_OUTPUT

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload JAR to S3 artifact bucket
        # Same bucket api-stack owns, worker/ prefix — no second bucket.
        run: |
          aws s3 cp "${{ steps.jar.outputs.jar_path }}" \
            "s3://${{ secrets.EB_ARTIFACT_BUCKET }}/worker/compendium-worker-${{ steps.version.outputs.release_version }}.jar"

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name compendium-article-fetch \
            --s3-bucket "${{ secrets.EB_ARTIFACT_BUCKET }}" \
            --s3-key "worker/compendium-worker-${{ steps.version.outputs.release_version }}.jar"

      - name: Wait for Lambda update to complete
        # update-function-code is asynchronous — mirrors deploy-api's
        # poll-until-PROCESSED step for the same reason.
        run: |
          for i in $(seq 1 20); do
            STATUS=$(aws lambda get-function --function-name compendium-article-fetch \
              --query 'Configuration.LastUpdateStatus' --output text)
            echo "Lambda update status: $STATUS (attempt $i/20)"
            if [ "$STATUS" = "Successful" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ]; then echo "Lambda update failed" >&2; exit 1; fi
            sleep 5
          done
          echo "Timed out waiting for Lambda update." && exit 1

  deploy-web:
    name: Build & deploy React SPA to S3
    # No git push in this job (no maven-release-plugin), so no race with
    # deploy-api/deploy-worker — runs independently, in parallel with them.
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack for Yarn 4
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - run: yarn install --immutable
        working-directory: web

      - run: yarn build
        working-directory: web

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync dist/ to S3
        # --delete removes stale Vite content-hashed bundles from S3.
        # Without it, old JS files accumulate indefinitely (Vite changes
        # the filename on every build, so old files are never overwritten).
        run: |
          aws s3 sync web/dist/ s3://${{ secrets.WEB_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable"
