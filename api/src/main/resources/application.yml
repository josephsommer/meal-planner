spring:
  application:
    name: compendium-api
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only verifies entities match at startup.
      ddl-auto: validate
    # Prevents lazy-loading being silently triggered inside serialization —
    # all data fetching must happen in the service layer.
    open-in-view: false
  flyway:
    enabled: true
  cloud:
    aws:
      parameterstore:
        # Disabled by default so the spring-cloud-aws auto-config does not attempt
        # an SSM connection in local dev or Testcontainers tests. Enabled via
        # application-aws.yml when SPRING_PROFILES_ACTIVE=aws.
        enabled: false
      region:
        # ArticleService needs an SqsTemplate bean in every profile (it's not
        # optional the way parameterstore is), and building that bean's
        # underlying SqsAsyncClient resolves its region eagerly at startup —
        # unlike credentials, which the AWS SDK only resolves lazily on the
        # first actual call. Without a region set somewhere, local dev/test
        # context startup fails outright. application-aws.yml sets the same
        # default explicitly too; this is what local dev and tests fall back to.
        static: ${AWS_DEFAULT_REGION:us-east-1}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Seeded into the users table by the V4__CreateAdminUser Flyway migration,
# which BCrypt-hashes admin-password before insert — only the hash is ever
# persisted. In prod (SPRING_PROFILES_ACTIVE=aws) admin-password comes from
# the SSM SecureString at /compendium/api/admin-password, picked up through
# the same aws-parameterstore import that already supplies db-master-password
# (see application-aws.yml). Unlike admin-username, this has no fallback
# default on purpose, matching how SPRING_DATASOURCE_* has none either:
# a missing/misconfigured SSM value should fail startup, not silently seed
# the admin account with a value baked into this file. Test-only defaults
# for both properties live in src/test/resources/application.yml.
admin-username: ${ADMIN_USERNAME:admin}
admin-password: ${ADMIN_PASSWORD}

# Shared secret the worker Lambda sends as X-Internal-Secret on its callback
# to /api/internal/** (see SharedSecretAuthFilter). Same no-default-outside-aws
# convention as admin-password above: in prod this is overridden by the SSM
# SecureString at /compendium/api/worker-shared-secret via the existing
# aws-parameterstore import; a missing value should fail startup, not silently
# accept an empty/guessable secret. Tests override via @TestPropertySource.
internal:
  worker-secret: ${WORKER_SHARED_SECRET}

# URL of the SQS queue ArticleService publishes fetch jobs to, and the rescan
# job (ArticleRescanConfig) republishes stuck articles / drains the DLQ from.
# Not a secret — matches the existing convention of plain EB env vars for
# non-sensitive config (see db.endpoint below).
app:
  article-fetch-queue-url: ${ARTICLE_FETCH_QUEUE_URL:}
  article-fetch-dlq-url: ${ARTICLE_FETCH_DLQ_URL:}

# Datasource is not declared here. Spring Boot reads SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME, and SPRING_DATASOURCE_PASSWORD from the environment
# and binds them to spring.datasource.* automatically (relaxed binding).
# In tests, @ServiceConnection overrides these with the Testcontainers MySQL URL.
