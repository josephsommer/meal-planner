spring:
  application:
    name: compendium-api
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only verifies entities match at startup.
      ddl-auto: validate
    # Prevents lazy-loading being silently triggered inside serialization —
    # all data fetching must happen in the service layer.
    open-in-view: false
  flyway:
    enabled: true
  cloud:
    aws:
      parameterstore:
        # Disabled by default so the spring-cloud-aws auto-config does not attempt
        # an SSM connection in local dev or Testcontainers tests. Enabled via
        # application-aws.yml when SPRING_PROFILES_ACTIVE=aws.
        enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Seeded into the users table by the V4__CreateAdminUser Flyway migration,
# which BCrypt-hashes admin-password before insert — only the hash is ever
# persisted. In prod (SPRING_PROFILES_ACTIVE=aws) admin-password is
# overridden by the SSM SecureString at /compendium/api/admin-password,
# picked up through the same aws-parameterstore import that already
# supplies db-master-password (see application-aws.yml). The fallback
# below is a local-dev-only default, never used once that override is set.
admin-username: ${ADMIN_USERNAME:admin}
admin-password: ${ADMIN_PASSWORD:changeme-local-only}

# Datasource is not declared here. Spring Boot reads SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME, and SPRING_DATASOURCE_PASSWORD from the environment
# and binds them to spring.datasource.* automatically (relaxed binding).
# In tests, @ServiceConnection overrides these with the Testcontainers MySQL URL.
